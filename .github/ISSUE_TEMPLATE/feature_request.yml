name: Feature request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: brand
    attributes:
      label: Battery brand
      options:
        - Sunpura
        - Lunergy
        - AEG
        - Voltdeer
        - AFERIY
        - AccuMate
        - JET
        - Oscal
        - Other / unknown
        - Not brand-specific
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Problem or use case
      placeholder: "I want to ... because ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: additional
    attributes:
      label: Additional context
